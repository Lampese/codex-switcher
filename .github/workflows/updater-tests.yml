name: Updater regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run updater regression tests
        run: npm run test:updater
