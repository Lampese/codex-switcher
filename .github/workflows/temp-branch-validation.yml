name: Temporary branch validation

on:
  push:
    branches:
      - fix/durable-state-mutations

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check formatting for changed Rust files
        run: |
          rustfmt --edition 2021 --check             src-tauri/src/auth/mod.rs             src-tauri/src/auth/storage.rs             src-tauri/src/auth/switcher.rs             src-tauri/src/auth/token_refresh.rs             src-tauri/src/commands/account.rs             src-tauri/src/app_menu.rs             src-tauri/src/commands/window.rs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
