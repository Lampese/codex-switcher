name: Temporary OAuth refresh validation

on:
  push:
    branches:
      - fix/oauth-refresh-policy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check changed Rust formatting
        run: |
          rustfmt --edition 2021 --check             src-tauri/src/auth/token_refresh.rs             src-tauri/src/api/usage.rs             src-tauri/src/commands/usage.rs             src-tauri/src/commands/account_stats.rs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
